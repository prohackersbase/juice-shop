name: Security Assessment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    name: Custom SAST
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep==1.183.0

      - name: Test custom rules
        run: |
          semgrep --test --config security/semgrep/eval-rule.yml security/semgrep/eval-rule.ts
          semgrep --test --config security/semgrep/sql-rule.yml security/semgrep/sql-rule.ts

      - name: Scan application routes
        run: |
          semgrep scan --error \
            --config security/semgrep/eval-rule.yml \
            --config security/semgrep/sql-rule.yml \
            routes
